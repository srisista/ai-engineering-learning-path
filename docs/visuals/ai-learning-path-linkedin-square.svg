  <path d="M88 920 C320 880, 520 880, 600 920 C680 960, 880 960, 1112 920" fill="none" stroke="url(#accent)" stroke-width="7"/>
  <circle cx="600" cy="920" r="14" fill="#0ea5e9"/>

  <rect x="88" y="980" width="1024" height="128" rx="12" fill="#0b1220" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="1048" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">
    No prior expertise required.
